name: Build and Deploy to AKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 수동 트리거 허용

env:
  ACR_NAME: aifprodacr
  ACR_LOGIN_SERVER: aifprodacr.azurecr.io
  IMAGE_NAME: scoring-server
  AKS_CLUSTER_NAME: aif-prod-aks
  AKS_RESOURCE_GROUP: aif-prod-rg
  K8S_NAMESPACE: scoring
  EVENT_HUB_NAME: "scoring-prod-hub"

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to ACR
      run: |
        az acr login --name ${{ env.ACR_NAME }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix={{branch}}-,suffix=-{{date 'YYYYMMDDHHmmss'}},format=short
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=branch
          type=semver,pattern={{version}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}

    - name: Azure logout
      run: |
        az logout

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Get AKS credentials
      run: |
        az aks get-credentials \
          --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
          --name ${{ env.AKS_CLUSTER_NAME }} \
          --overwrite-existing

    - name: Create or update secrets
      run: |
        # Event Hub, Blob Connection String, Azure Monitor
        kubectl create secret generic azure-secrets \
          --from-literal=event-hub-conn-str='${{ secrets.EVENT_HUB_CONN_STR }}' \
          --from-literal=event-hub-name='${{ env.EVENT_HUB_NAME }}' \
          --from-literal=blob-conn-str='${{ secrets.BLOB_CONN_STR }}' \
          --from-literal=azure-monitor-connection-string='${{ secrets.AZURE_MONITOR_CONNECTION_STRING }}' \
          --namespace ${{ env.K8S_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

        # Azure Blob CSI Driver용 Secret (Job의 /mnt/logs 마운트에 사용)
        kubectl create secret generic azure-blob-secret \
          --from-literal=azurestorageaccountname=aifprodstorageaccount \
          --from-literal=azurestorageaccountkey='${{ secrets.AZURE_STORAGE_KEY }}' \
          --namespace ${{ env.K8S_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy RBAC and HPA
      run: |
        kubectl apply -f k8s/rbac.yaml
        kubectl apply -f k8s/hpa.yaml

    - name: Deploy to AKS
      run: |
        # SHA 기반 이미지 태그 추출 (고유한 이미지 보장)
        IMAGE_TAG=$(echo "${{ needs.build-and-push.outputs.image-tag }}" | grep -E "main-[a-f0-9]+-[0-9]+" | head -n1)

        if [ -z "$IMAGE_TAG" ]; then
          echo "Error: Could not find SHA-based image tag"
          echo "Available tags: ${{ needs.build-and-push.outputs.image-tag }}"
          exit 1
        fi

        echo "Deploying image: ${IMAGE_TAG}"

        # deployment.yaml의 이미지 업데이트
        sed -i "s|image:.*scoring-server.*|image: ${IMAGE_TAG}|g" k8s/deployment.yaml

        # RBAC 및 서비스 적용
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml

        # 롤아웃 강제 (annotation 추가)
        kubectl patch deployment scoring-server -n ${{ env.K8S_NAMESPACE }} \
          -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}}}"

    - name: Check deployment status
      if: always()
      run: |
        echo "=== Deployment Status ==="
        kubectl get deployment scoring-server -n ${{ env.K8S_NAMESPACE }}

        echo -e "\n=== Pod Status ==="
        kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=scoring-server -o wide

        echo -e "\n=== Pod Events ==="
        kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | grep scoring-server | tail -20

        echo -e "\n=== Pod Logs (for CrashLoopBackOff pods) ==="
        for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=scoring-server -o jsonpath='{.items[*].metadata.name}'); do
          STATUS=$(kubectl get pod $pod -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || echo "")
          if [[ "$STATUS" == "CrashLoopBackOff" ]] || [[ "$STATUS" == "Error" ]]; then
            echo -e "\n--- Logs from $pod ---"
            kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --tail=50 --previous 2>/dev/null || kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --tail=50 2>/dev/null || echo "No logs available"
          fi
        done

        echo -e "\n=== Pod Describe (for any pending/failed pods) ==="
        for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=scoring-server -o jsonpath='{.items[*].metadata.name}'); do
          STATUS=$(kubectl get pod $pod -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.phase}')
          if [ "$STATUS" != "Running" ]; then
            echo "--- Pod: $pod (Status: $STATUS) ---"
            kubectl describe pod $pod -n ${{ env.K8S_NAMESPACE }} | tail -30
          fi
        done

    - name: Wait for deployment
      run: |
        echo "Waiting for rollout to complete..."
        if kubectl rollout status deployment/scoring-server -n ${{ env.K8S_NAMESPACE }} --timeout=3m; then
          echo "✅ Deployment successful!"
        else
          echo "⚠️  Rollout timeout, checking if deployment is stable..."

          # 타임아웃이어도 Pod가 Ready면 성공으로 간주
          READY=$(kubectl get deployment scoring-server -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl get deployment scoring-server -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.replicas}')

          if [ "$READY" == "$DESIRED" ] && [ "$READY" != "" ]; then
            echo "✅ All $READY/$DESIRED replicas are ready - deployment is stable"
            exit 0
          else
            echo "❌ Deployment failed: $READY/$DESIRED replicas ready"
            exit 1
          fi
        fi

    - name: Get service endpoint
      run: |
        kubectl get service scoring-server -n ${{ env.K8S_NAMESPACE }}

    - name: Verify deployment
      run: |
        POD_NAME=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=scoring-server -o jsonpath='{.items[0].metadata.name}')
        echo "Deployed pod: $POD_NAME"
        kubectl logs $POD_NAME -n ${{ env.K8S_NAMESPACE }} --tail=50

    - name: Azure logout
      if: always()
      run: |
        az logout