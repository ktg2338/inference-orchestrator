apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-server
  namespace: scoring
  labels:
    app: scoring-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: scoring-server
  template:
    metadata:
      labels:
        app: scoring-server
    spec:
      serviceAccountName: scoring-service-account
      containers:
      - name: scoring-server
        image: aifprodacr.azurecr.io/scoring-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: EVENT_HUB_CONN_STR
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: event-hub-conn-str
              optional: false
        - name: EVENT_HUB_NAME
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: event-hub-name
              optional: false
        - name: BLOB_CONN_STR
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: blob-conn-str
              optional: false
        - name: AZURE_MONITOR_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-secrets
              key: azure-monitor-connection-string
              optional: true
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 250m
            memory: 2Gi
          limits:
            cpu: 500m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scoring-service-account
  namespace: scoring
